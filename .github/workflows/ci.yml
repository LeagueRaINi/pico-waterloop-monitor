name: CI

# Releases are built by release.yml, off tags.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each job below only checks one part of the tree, so there is no reason
  # to run it - and wait on a Windows runner for the Rust one - when a PR
  # or push touches neither. `if: needs.changes.outputs.<x> == 'true'` on a
  # job (not `paths:` on the trigger) is what keeps this a required check
  # branch protection can still see and mark passed, rather than a run
  # that silently never starts.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # paths-filter needs this to list a pull request's changed files via the
    # API; the push-triggered path below instead diffs the local checkout.
    permissions:
      pull-requests: read
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bridge:
              - 'pc/**'
              - '.github/workflows/ci.yml'
            firmware:
              - 'firmware/**'
              - 'tools/**'
              - 'pc/hwinfo-pico-bridge-core/src/pico/prelude.py'
              - '.github/workflows/ci.yml'

  bridge:
    name: Build bridge
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc

      - name: Check formatting
        working-directory: pc
        run: cargo fmt --check

      - name: Clippy
        working-directory: pc
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: pc
        run: cargo test --all-targets

      - name: Build
        working-directory: pc
        run: cargo build --release

      - uses: actions/upload-artifact@v5
        with:
          name: hwinfo-pico-bridge
          path: |
            pc/target/release/hwinfo-pico-bridge.exe
            pc/target/release/hwinfo-pico-bridge-tray.exe

  firmware:
    name: Check firmware
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Catches syntax errors before they reach a device that can only report
      # them over a serial console.
      - name: Compile firmware
        run: python -m compileall -q firmware

      # The updater's helpers run as real Python on the Pico, but only ever
      # get there as a string sent over the REPL - a syntax error would
      # otherwise only show up as a traceback from a device someone is
      # trying to update.
      - name: Compile the device-side deploy helpers
        run: python -m compileall -q pc/hwinfo-pico-bridge-core/src/pico/prelude.py

      # Runs the real button state machine (_poll_buttons) against fake,
      # scriptable GPIO across simulated ticks - not just a syntax check.
      # No extra dependencies, unlike render_preview.py's Pillow.
      - name: Test button handling
        run: python tools/test_buttons.py
